name: studioos

# Production-style stack. Object storage is expected to be an external
# S3-compatible service configured through .env.production.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production pull
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# The one-shot `migrate` service applies committed migrations before the API
# and worker start.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studioos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-studio_os}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  migrate:
    image: ${API_IMAGE:?Set API_IMAGE}
    command:
      - npx
      - --no-install
      - prisma
      - migrate
      - deploy
      - --schema
      - apps/api/prisma/schema.prisma
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-studioos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studio_os}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  api:
    image: ${API_IMAGE:?Set API_IMAGE}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-studioos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studio_os}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN}
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "4000"

  worker:
    image: ${API_IMAGE:?Set API_IMAGE}
    command: ["node", "apps/api/dist/worker.js"]
    restart: unless-stopped
    healthcheck:
      disable: true
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-studioos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studio_os}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
