name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: studioos
          POSTGRES_PASSWORD: studioos
          POSTGRES_DB: studio_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studioos -d studio_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://studioos:studioos@localhost:5432/studio_os_test
      TEST_DATABASE_URL: postgresql://studioos:studioos@localhost:5432/studio_os_test
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters-long
      WEB_ORIGIN: http://localhost:5174
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
