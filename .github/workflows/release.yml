name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built images to production
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and publish images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-base: ${{ steps.names.outputs.base }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute lowercase image names
        id: names
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: |
            ${{ steps.names.outputs.base }}/api:${{ github.sha }}
            ${{ steps.names.outputs.base }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          build-args: |
            VITE_API_URL=/api/v1
          tags: |
            ${{ steps.names.outputs.base }}/web:${{ github.sha }}
            ${{ steps.names.outputs.base }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to production
    needs: images
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull, migrate, and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_BASE: ${{ needs.images.outputs.image-base }}
          IMAGE_TAG: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail
             cd '$DEPLOY_PATH'
             export API_IMAGE='$IMAGE_BASE/api:$IMAGE_TAG'
             export WEB_IMAGE='$IMAGE_BASE/web:$IMAGE_TAG'
             printf '%s' '$GHCR_TOKEN' | docker login ghcr.io -u '$ACTOR' --password-stdin
             docker compose -f docker-compose.prod.yml --env-file .env.production pull
             docker compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans
             docker image prune -f"
